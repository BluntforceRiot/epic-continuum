name: macOS authority-capacity diagnostic

"on":
  push:
    branches:
      - diagnostic/macos-authority-82e890c

permissions:
  contents: read

jobs:
  failing-test:
    name: Exact failing test (macOS, Python 3.13)
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install project under test
        run: |
          python -m pip install --upgrade pip "setuptools>=77" build
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Run macOS publication and capacity regressions
        run: |
          python -m unittest -v \
            tests.test_core_flows.EpicContinuumCoreFlowTest.test_atomic_noclobber_rename_moves_once_and_preserves_existing_bytes \
            tests.test_authority_capacity.ProjectStateAuthorityCapacityTests.test_1001_projects_remain_verifiable_resumable_and_snapshottable \
            tests.test_authority_capacity.ProjectStateAuthorityCapacityTests.test_257_sequential_checkpoints_remain_consistently_usable
