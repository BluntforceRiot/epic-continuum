name: Epic Continuum CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Show interpreter
        run: python --version
      - name: Install project under test
        run: |
          python -m pip install --upgrade pip "setuptools>=77" build
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Verify review fixture secret allowlist
        run: python scripts/generate_review_fixture_allowlist.py --check
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  static-analysis:
    name: Ruff and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install static-analysis tooling
        run: |
          python -m pip install --upgrade pip "setuptools>=77" "ruff==0.15.*" "mypy==2.2.*"
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Run Ruff
        run: ruff check src tests scripts setup.py
      - name: Run mypy
        run: mypy src/continuum

  package-smoke:
    name: Build, install, and bundle smoke
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.5"
      - name: Install build tooling
        run: >-
          python -m pip install
          "pip==25.1.1"
          "setuptools==80.9.0"
          "wheel==0.45.1"
          "build==1.2.2.post1"
          "twine==6.1.0"
      - name: Set reproducible build epoch
        shell: bash
        run: |
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Build public release archive
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist
          python scripts/build_release_package.py --out-dir dist
          python - <<'PY'
          import tomllib
          import zipfile
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          prefix = f"epic-continuum-{version}/"
          archive = Path(f"dist/epic-continuum-{version}.zip")
          with zipfile.ZipFile(archive) as zf:
              names = zf.namelist()
              assert len(names) == len(set(names)), "release ZIP contains duplicate member names"
              assert all(name.startswith(prefix) for name in names)
              assert f"{prefix}docs/GITHUB_PUBLICATION_DRAFT.md" not in names
              assert not any("/benchmarks/results/" in name for name in names)
              for linked in (
                  "docs/how-memory-works.md",
                  "docs/context-window.md",
                  "docs/cue-recall.md",
                  "docs/recovery-and-continuity.md",
                  "docs/evidence-and-proof.md",
                  "docs/shared-agent-state.md",
                  "docs/worker-operations.md",
                  "docs/writer-claims.md",
                  "benchmarks/BENCHMARKS.md",
                  "benchmarks/README.md",
                  "benchmarks/datasets/README.md",
                  "benchmarks/fixtures/continuitybench_cases.json",
                  "benchmarks/runners/_common.py",
                  "benchmarks/runners/continuitybench.py",
                  "benchmarks/runners/faultbench.py",
                  "benchmarks/runners/scale_bench.py",
              ):
                  assert f"{prefix}{linked}" in names, linked
              for name in (
                  f"{prefix}scripts/install_codex_plugin.sh",
                  f"{prefix}scripts/install_hermes_adapter.sh",
              ):
                  mode = (zf.getinfo(name).external_attr >> 16) & 0o777
                  assert mode == 0o755, (name, oct(mode))
              name = f"{prefix}scripts/build_release_package.py"
              mode = (zf.getinfo(name).external_attr >> 16) & 0o777
              assert mode == 0o644, (name, oct(mode))
          PY
      - name: Build canonical reproducible wheel and source distribution
        shell: bash
        run: |
          version="$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          archive="dist/epic-continuum-${version}.zip"
          source_a="${RUNNER_TEMP}/continuum-release-source-a"
          source_b="${RUNNER_TEMP}/continuum-release-source-b"
          out_a="${RUNNER_TEMP}/continuum-release-dist-a"
          out_b="${RUNNER_TEMP}/continuum-release-dist-b"
          rm -rf "$source_a" "$source_b" "$out_a" "$out_b"
          mkdir -p "$source_a" "$source_b" "$out_a" "$out_b"
          python -m zipfile -e "$archive" "$source_a"
          python -m zipfile -e "$archive" "$source_b"
          python -m build --sdist --wheel --no-isolation --outdir "$out_a" "$source_a/epic-continuum-${version}"
          env -u SOURCE_DATE_EPOCH python -m build --sdist --wheel --no-isolation --outdir "$out_b" "$source_b/epic-continuum-${version}"
          for artifact in "$out_a"/*; do
            cmp "$artifact" "$out_b/$(basename "$artifact")"
          done
          cp "$out_a"/*.whl "$out_a"/*.tar.gz dist/
          python -m twine check dist/*.whl dist/*.tar.gz
          python - <<'PY'
          import tarfile
          import tomllib
          import zipfile
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          release_path = Path(f"dist/epic-continuum-{version}.zip")
          with zipfile.ZipFile(release_path) as release:
              root_provenance = release.read(f"epic-continuum-{version}/RELEASE_PROVENANCE.json")
              package_provenance = release.read(
                  f"epic-continuum-{version}/src/continuum/assets/RELEASE_PROVENANCE.json"
              )
          assert package_provenance == root_provenance

          wheel_path = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel_path) as wheel:
              assert wheel.read("continuum/assets/RELEASE_PROVENANCE.json") == root_provenance

          sdist_path = next(Path("dist").glob("*.tar.gz"))
          with tarfile.open(sdist_path, "r:gz") as sdist:
              member = sdist.extractfile(
                  f"epic_continuum_memory-{version}/src/continuum/assets/RELEASE_PROVENANCE.json"
              )
              assert member is not None
              assert member.read() == root_provenance
          PY
      - name: Write distribution checksums
        shell: bash
        run: sha256sum dist/*.whl dist/*.tar.gz dist/*.zip > dist/SHA256SUMS
      - name: Clean wheel install and CLI handoff smoke
        shell: bash
        run: |
          python -m venv /tmp/continuum-ci-wheel-venv
          /tmp/continuum-ci-wheel-venv/bin/python -m pip install --no-index --find-links dist epic-continuum-memory
          ROOT="${RUNNER_TEMP}/continuum-wheel-root"
          BUNDLE="${RUNNER_TEMP}/continuum-wheel-root.zip"
          /tmp/continuum-ci-wheel-venv/bin/continuum --version
          /tmp/continuum-ci-wheel-venv/bin/continuum init --root "$ROOT"
          /tmp/continuum-ci-wheel-venv/bin/continuum status --root "$ROOT"
          /tmp/continuum-ci-wheel-venv/bin/continuum audit-secrets --root "$ROOT"
          /tmp/continuum-ci-wheel-venv/bin/continuum verify-root --root "$ROOT"
          /tmp/continuum-ci-wheel-venv/bin/continuum pack-root --root "$ROOT" --out "$BUNDLE"
          /tmp/continuum-ci-wheel-venv/bin/continuum verify-bundle --path "$BUNDLE"
          HOSTILE_ROOT="${RUNNER_TEMP}/continuum-hostile-root"
          HOSTILE_OUTSIDE="${RUNNER_TEMP}/continuum-hostile-outside"
          /tmp/continuum-ci-wheel-venv/bin/continuum init --root "$HOSTILE_ROOT"
          mkdir -p "$HOSTILE_ROOT/run" "$HOSTILE_OUTSIDE"
          ln -s "$HOSTILE_OUTSIDE" "$HOSTILE_ROOT/run/restore_drills"
          if /tmp/continuum-ci-wheel-venv/bin/continuum verify-root --root "$HOSTILE_ROOT" --no-secret-scan > "${RUNNER_TEMP}/continuum-hostile-verify.json"; then
            cat "${RUNNER_TEMP}/continuum-hostile-verify.json"
            echo "verify-root unexpectedly accepted a linked restore-drill output parent"
            exit 1
          fi
          test -z "$(find "$HOSTILE_OUTSIDE" -mindepth 1 -maxdepth 1 -print -quit)"
          /tmp/continuum-ci-wheel-venv/bin/python -c "from importlib.resources import files; assert files('continuum').joinpath('assets/schemas/root_bundle_manifest.schema.json').is_file()"
      - name: Clean source-distribution install smoke
        shell: bash
        run: |
          python -m venv /tmp/continuum-ci-sdist-venv
          /tmp/continuum-ci-sdist-venv/bin/python -m pip install --upgrade pip "setuptools>=77" wheel
          /tmp/continuum-ci-sdist-venv/bin/python -m pip install --no-build-isolation dist/epic_continuum_memory-*.tar.gz
          ROOT="${RUNNER_TEMP}/continuum-sdist-root"
          /tmp/continuum-ci-sdist-venv/bin/continuum init --root "$ROOT"
          /tmp/continuum-ci-sdist-venv/bin/continuum status --root "$ROOT"
          /tmp/continuum-ci-sdist-venv/bin/continuum verify-root --root "$ROOT"
          /tmp/continuum-ci-sdist-venv/bin/python -c "from importlib.resources import files; assert files('continuum').joinpath('assets/schemas/root_bundle_manifest.schema.json').is_file()"
      - name: Deterministic benchmark smoke
        shell: bash
        run: |
          python benchmarks/runners/continuitybench.py \
            --quick \
            --budgets 1000 \
            --enforce-v03-gates \
            --output-dir "${RUNNER_TEMP}/continuitybench-ci"
          test -f "${RUNNER_TEMP}/continuitybench-ci/summary.json"
          test -f "${RUNNER_TEMP}/continuitybench-ci/cases.jsonl"
          test -f "${RUNNER_TEMP}/continuitybench-ci/environment.json"
      - name: Verify Git modes and line endings
        shell: bash
        run: |
          test "$(git ls-files -s -- scripts/install_codex_plugin.sh | awk '{print $1}')" = "100755"
          test "$(git ls-files -s -- scripts/install_hermes_adapter.sh | awk '{print $1}')" = "100755"
          test "$(git ls-files -s -- scripts/build_release_package.py | awk '{print $1}')" = "100644"

          if git ls-files --eol | grep -q 'w/mixed'; then
            echo "Mixed line endings detected:"
            git ls-files --eol | grep 'w/mixed'
            exit 1
          fi
      - name: Smoke installer wrappers
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/codex-stage-sh" "${RUNNER_TEMP}/codex-stage-ps"
          echo keep > "${RUNNER_TEMP}/codex-stage-sh/keep.txt"
          echo keep > "${RUNNER_TEMP}/codex-stage-ps/keep.txt"

          bash scripts/install_codex_plugin.sh \
            --stage-root "${RUNNER_TEMP}/codex-stage-sh" \
            --root "${RUNNER_TEMP}/continuum-codex-sh" \
            --python python \
            --stage-only
          test -f "${RUNNER_TEMP}/codex-stage-sh/keep.txt"
          test -f "${RUNNER_TEMP}/codex-stage-sh"/epic-continuum/plugins/continuum/.mcp.json

          bash scripts/install_hermes_adapter.sh \
            --root "${RUNNER_TEMP}/continuum-hermes-sh" \
            --hermes-home "${RUNNER_TEMP}/hermes-sh" \
            --python python \
            --dry-run \
            --skip-enable

          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -File scripts/install_codex_plugin.ps1 \
              -StageRoot "${RUNNER_TEMP}/codex-stage-ps" \
              -ContinuumRoot "${RUNNER_TEMP}/continuum-codex-ps" \
              -Python python \
              -StageOnly
            test -f "${RUNNER_TEMP}/codex-stage-ps/keep.txt"
            test -f "${RUNNER_TEMP}/codex-stage-ps"/epic-continuum/plugins/continuum/.mcp.json

            pwsh -NoProfile -File scripts/install_hermes_adapter.ps1 \
              -ContinuumRoot "${RUNNER_TEMP}/continuum-hermes-ps" \
              -HermesHome "${RUNNER_TEMP}/hermes-ps" \
              -Python python \
              -DryRun \
              -SkipEnable
          else
            echo "pwsh not available; PowerShell wrapper smoke skipped"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: epic-continuum-distributions
          path: dist/*
