name: macOS authority-capacity diagnostic

"on":
  push:
    branches:
      - diagnostic/macos-authority-82e890c

permissions:
  contents: read

jobs:
  failing-test:
    name: Exact failing test (macOS, Python 3.13)
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install project under test
        run: |
          python -m pip install --upgrade pip "setuptools>=77" build
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Print compact sidecar failure
        run: |
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path

          from continuum.core import store
          from tests.test_authority_capacity import _seed_independent_project_states

          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp) / "continuum"
              card_ids = _seed_independent_project_states(root, count=1001)
              result = store.sync_pending_card_sidecars(root)
              compact = {
                  "card_count": len(card_ids),
                  "ok": result.get("ok"),
                  "synced": result.get("synced"),
                  "deferred": result.get("deferred"),
                  "failed": result.get("failed"),
                  "pending": result.get("pending"),
                  "failure_count": len(result.get("failures") or []),
                  "failure_sample": (result.get("failures") or [])[:3],
                  "compensation_cas_complete": result.get("compensation_cas_complete"),
              }
              print(json.dumps(compact, indent=2, sort_keys=True))
              if not result.get("ok"):
                  raise SystemExit(1)
          PY
