# Example Hermes model route for a local OpenAI-compatible Qwen endpoint.
model:
  default: "qwen-local"
  provider: "custom"
  api_key: "none"
  base_url: "http://127.0.0.1:8000/v1"
  context_length: 32768
  max_tokens: 4096

model_aliases:
  qwen-local:
    model: "qwen-local"
    provider: "custom"
    base_url: "http://127.0.0.1:8000/v1"
